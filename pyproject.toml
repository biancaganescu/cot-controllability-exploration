[project]
name = "cot-controllability"
version = "0.1.0"
description = "Pilot: can a reasoning model keep a private token out of its visible CoT?"
readme = "README.md"
requires-python = ">=3.10"
# Runner and scorer are stdlib-only by design; add runtime deps here when needed.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
cot-demo = "cot_controllability.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cot_controllability"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
